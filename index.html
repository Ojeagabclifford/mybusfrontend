<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliffordbx Tec | Dashboard</title>
    <link rel="stylesheet" href="./frontend/style.css">
</head>
<body>
    <nav class="topbar">
        <div class="brand">
            <span class="brand-tag">Cliffordbx Tec</span>
            <h1>Business Dashboard</h1>
            <p class="brand-subtitle">Track income, expenses and tithe with a clean, future-ready interface.</p>
        </div>
        <div class="stats-bar">
            <a href="entry.html" class="nav-link">Add Entry</a>
            <a href="records.html" class="nav-link">Records</a>
        </div>
    </nav>

    <main class="dashboard-grid">
        <div class="stat-card gross-income">
            <label>Gross Income</label>
            <h2 id="gross-income">₦0</h2>
        </div>
        <div class="stat-card total-expenses">
            <label>Total Expenses</label>
            <h2 id="total-expenses">₦0</h2>
        </div>
        <div class="stat-card total-tithe">
            <label>Total Tithe</label>
            <h2 id="total-tithes">₦0</h2>
        </div>
        <div class="stat-card paid-tithe">
            <label>Paid Tithe</label>
            <h2 id="paid-tithes">₦0</h2>
        </div>
        <div class="stat-card remaining-tithe">
            <label>Remaining Tithe</label>
            <h2 id="remaining-tithes">₦0</h2>
        </div>
        <div class="stat-card net-profit highlight">
            <label>Final Net Profit</label>
            <h2 id="net-profit">₦0</h2>
        </div>
        <div class="insight-box full-width">
            <h4>Next step</h4>
            <p>Use the Add Entry page to add records and the Records page to filter by date and search.</p>
        </div>
    </main>

    <script src="./frontend/app.js"></script>
</body>
</html>
